name: Build GKI Kernel Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:          # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出驱动源码
        uses: actions/checkout@v4

      - name: 使用 GKI 构建内核模块
        id: build
        uses: feicong/android-kernel-build-action@v1
        with:
          arch: arm64                     # 架构
          tag: android14-6.1             # 对应 Android 14 + Kernel 6.1
          module-name: kernrw             # 模块名（将生成 kernrw.ko）
          module-path: drivers/misc/kernrw # 驱动源码所在路径（相对于仓库根目录）

      - name: 上传编译好的模块
        uses: actions/upload-artifact@v4
        with:
          name: kernrw-ko
          path: ${{ steps.build.outputs.module-path }}/kernrw.ko
