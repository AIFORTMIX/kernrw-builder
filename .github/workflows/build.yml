name: Build GKI Kernel Module (with phone config, ABI disabled)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出驱动源码
        uses: actions/checkout@v4

      - name: 安装编译工具链
        run: |
          sudo apt update
          sudo apt install -y git make flex bison bc rsync cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libelf-dev libdw-dev build-essential

      - name: 下载 GKI 内核源码（android14-6.1）
        run: |
          git clone --depth 1 --branch android14-6.1 \
            https://android.googlesource.com/kernel/common.git kernel
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig

      - name: 应用手机配置并彻底禁用 ABI
        run: |
          cp config kernel/.config
          cd kernel
          # 使用 scripts/config 禁用所有 ABI 相关选项
          scripts/config --file .config --disable CONFIG_ABI || true
          scripts/config --file .config --disable CONFIG_ABI_MONITOR || true
          scripts/config --file .config --disable CONFIG_KABI_RESERVED || true
          scripts/config --file .config --disable CONFIG_KABI_ABI_REV || true
          scripts/config --file .config --disable CONFIG_ABI_REV || true
          # 强力删除 .config 中任何包含 "ABI" 或 "abi" 的行（以防万一）
          sed -i '/[Aa][Bb][Ii]/d' .config
          # 重新生成配置
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: 绕过 ABI 白名单并执行 modules_prepare
        run: |
          cd kernel
          # 创建空的白名单文件（可能仍被检查，但已禁用选项）
          touch abi_symbolistraw abi_whitelist_raw abi_whitelist
          # 执行 modules_prepare，现在 ABI 已禁用，应该通过
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

      - name: 将驱动源码复制到内核树
        run: |
          mkdir -p kernel/drivers/misc/kernrw
          cp drivers/misc/kernrw/kernrw.c kernel/drivers/misc/kernrw/
          cp drivers/misc/kernrw/Makefile kernel/drivers/misc/kernrw/
          echo "obj-m += kernrw.o" > kernel/drivers/misc/kernrw/Makefile

      - name: 编译内核模块
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/misc/kernrw \
            KBUILD_MODPOST_WARN=1 \
            KBUILD_CFLAGS="-Wno-error" \
            modules

      - name: 上传编译好的模块
        uses: actions/upload-artifact@v4
        with:
          name: kernrw-ko
          path: kernel/drivers/misc/kernrw/kernrw.ko
