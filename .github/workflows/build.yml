name: Build GKI Kernel Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:          # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出驱动源码
        uses: actions/checkout@v4

      - name: 使用 GKI 构建内核模块
        id: build
        uses: feicong/android-kernel-build-action@v1
        with:
          arch: arm64
          tag: android14-6.1
          module-name: kernrw
          module-path: drivers/misc/kernrw

      - name: 查找生成的模块
        id: find
        run: |
          # 在当前工作目录下递归查找 kernrw.ko
          ko_file=$(find . -name "kernrw.ko" -type f | head -n 1)
          if [ -z "$ko_file" ]; then
            echo "未找到 kernrw.ko，请检查编译日志"
            exit 1
          fi
          echo "找到模块: $ko_file"
          echo "ko_path=$ko_file" >> $GITHUB_OUTPUT

      - name: 上传编译好的模块
        uses: actions/upload-artifact@v4
        with:
          name: kernrw-ko
          path: ${{ steps.find.outputs.ko_path }}
