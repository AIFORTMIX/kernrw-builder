# ============================================================================
# GitHub Actions Workflow: Build OLLVM (Obfuscator-LLVM) as a NewPM Pass
# Plugin DLL for LLVM 19.x on Windows x64
#
# This workflow:
#   1. Sets up the Windows MSVC (cl.exe) build environment
#   2. Clones LLVM 19.1.0 source code from the official repository
#   3. Clones OLLVM obfuscation pass sources from DreamSoule/ollvm17
#   4. Copies the Obfuscation passes into the LLVM source tree
#   5. Patches Obfuscation sources for LLVM 19 API compatibility
#   6. Copies the standalone plugin project (CMakeLists.txt + OllvmPlugin.cpp)
#      from the repository's ollvm_plugin/ directory
#   7. Configures and builds LLVM libraries (Release, with clang,
#      AArch64/ARM/X86 targets) using cmake + ninja + MSVC (cl.exe)
#   8. Builds the OLLVM obfuscation passes as a standalone loadable plugin DLL
#   9. Uploads the resulting plugin DLL as a downloadable artifact
#
# Usage:
#   - Push to the main branch (or any branch) to trigger
#   - Or manually trigger via GitHub Actions -> workflow_dispatch
# ============================================================================

name: Build OLLVM Plugin for LLVM 19 (Windows x64)

on:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: 'LLVM git ref (tag or branch)'
        required: true
        default: 'llvmorg-19.1.0'
      obfuscation_repo:
        description: 'Obfuscation pass source repository'
        required: true
        default: 'https://github.com/DreamSoule/ollvm17.git'

env:
  LLVM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.llvm_ref || 'llvmorg-19.1.0' }}
  OBFUSCATION_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.obfuscation_repo || 'https://github.com/DreamSoule/ollvm17.git' }}
  BUILD_TYPE: Release
  PLUGIN_NAME: OLLVM-Obfuscator

jobs:
  build-ollvm-plugin:
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------------
      # Step 1: Checkout the workflow repository (contains ollvm_plugin/ templates)
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # Step 2: Set up Visual Studio Developer Command Prompt (MSVC)
      # ------------------------------------------------------------------
      - name: Setup Visual Studio MSVC environment
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: 'latest'

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------------
      # Step 3: Install Ninja build system
      # ------------------------------------------------------------------
      - name: Install Ninja
        run: choco install ninja --no-progress --yes

      # ------------------------------------------------------------------
      # Step 4: Install Python (required by LLVM build system)
      # ------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------------
      # Step 5: Clone LLVM source code
      # ------------------------------------------------------------------
      - name: Clone LLVM ${{ env.LLVM_REF }}
        shell: pwsh
        run: |
          Write-Host "Cloning LLVM at ref: $env:LLVM_REF"
          git clone --depth 1 --branch $env:LLVM_REF `
            https://github.com/llvm/llvm-project.git llvm-project
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone LLVM at ref $env:LLVM_REF"
          }
          Write-Host "LLVM source cloned successfully"
          git -C llvm-project log --oneline -1

      # ------------------------------------------------------------------
      # Step 6: Clone OLLVM obfuscation pass sources
      # ------------------------------------------------------------------
      - name: Clone OLLVM obfuscation pass sources
        shell: pwsh
        run: |
          Write-Host "Cloning obfuscation sources from: $env:OBFUSCATION_REPO"
          git clone --depth 1 $env:OBFUSCATION_REPO ollvm17
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone obfuscation repository"
          }
          Write-Host "Obfuscation sources cloned successfully"
          git -C ollvm17 log --oneline -1

      # ------------------------------------------------------------------
      # Step 7: Copy Obfuscation passes into the LLVM source tree
      #
      # The DreamSoule/ollvm17 repository provides NewPM-compatible
      # obfuscation passes in llvm-project/llvm/lib/Passes/Obfuscation/
      #
      # We copy the Obfuscation/ directory into the LLVM source tree,
      # then create a standalone plugin project that compiles the
      # obfuscation source files into a loadable module (DLL).
      #
      # The plugin registers the passes via llvm::PassPluginLibraryInfo,
      # which is the standard LLVM NewPM plugin mechanism.
      # The plugin DLL can be loaded via:
      #   clang -fpass-plugin=OLLVM-Obfuscator.dll
      #
      # NOTE: We do NOT patch PassBuilder.cpp in the LLVM source tree.
      # The Obfuscation passes are registered by the plugin itself,
      # not by the LLVM PassBuilder. This avoids conflicts and keeps
      # the LLVM source tree clean.
      # ------------------------------------------------------------------
      - name: Copy Obfuscation passes into LLVM source tree
        shell: pwsh
        run: |
          $src = "ollvm17/llvm-project/llvm/lib/Passes/Obfuscation"
          $dst = "llvm-project/llvm/lib/Passes/Obfuscation"

          if (-not (Test-Path $src)) {
            Write-Host "ERROR: Source Obfuscation directory not found at $src"
            Get-ChildItem "ollvm17/llvm-project/llvm/lib/Passes" -Name
            throw "Obfuscation directory not found in cloned repository"
          }

          Write-Host "Copying Obfuscation/ from $src to $dst"
          Copy-Item -Recurse -Force $src $dst

          Write-Host "Obfuscation directory contents:"
          Get-ChildItem -Path $dst -Name

      # ------------------------------------------------------------------
      # Step 7b: Patch Obfuscation sources for LLVM 19 API compatibility
      #
      # LLVM 17 -> 19 API changes cause 4 compilation errors:
      # 1. FCmpInst constructor: BasicBlock* -> InsertPosition parameter
      # 2. AllocaInst constructor ambiguity with 0 literal
      # 3. ConstantExpr::getSub() removed in LLVM 19
      # 4. CriticalEdgeSplittingOptions constructor param type change
      # ------------------------------------------------------------------
      - name: Patch Obfuscation sources for LLVM 19
        shell: pwsh
        run: |
          # Fix 1: BogusControlFlow.cpp - FCmpInst constructor
          $f1 = "llvm-project/llvm/lib/Passes/Obfuscation/BogusControlFlow.cpp"
          if (-not (Test-Path $f1)) { throw "BogusControlFlow.cpp not found" }
          $c1 = Get-Content $f1 -Raw
          $c1 = $c1 -replace 'new FCmpInst\(\*basicBlock,', 'new FCmpInst(basicBlock,'
          $c1 = $c1 -replace 'new FCmpInst\(\*originalBB,', 'new FCmpInst(originalBB,'
          Set-Content -Path $f1 -Value $c1 -Encoding UTF8
          Write-Host "  [OK] BogusControlFlow.cpp - 2x FCmpInst constructor fixed"

          # Fix 2: Flattening.cpp - AllocaInst constructor ambiguity
          $f2 = "llvm-project/llvm/lib/Passes/Obfuscation/Flattening.cpp"
          if (-not (Test-Path $f2)) { throw "Flattening.cpp not found" }
          $c2 = Get-Content $f2 -Raw
          $c2 = $c2 -replace 'new AllocaInst\(TYPE_I32, 0, "swVar\.ptr",', 'new AllocaInst(TYPE_I32, 0, nullptr, "swVar.ptr",'
          Set-Content -Path $f2 -Value $c2 -Encoding UTF8
          Write-Host "  [OK] Flattening.cpp - AllocaInst constructor disambiguated"

          # Fix 3: IPObfuscationContext.cpp - ConstantExpr::getSub removed
          $f3 = "llvm-project/llvm/lib/Passes/Obfuscation/IPObfuscationContext.cpp"
          if (-not (Test-Path $f3)) { throw "IPObfuscationContext.cpp not found" }
          $c3 = Get-Content $f3 -Raw
          $c3 = $c3 -replace 'ConstantExpr::getSub\(', 'ConstantExpr::get(Instruction::Sub, '
          Set-Content -Path $f3 -Value $c3 -Encoding UTF8
          Write-Host "  [OK] IPObfuscationContext.cpp - ConstantExpr::getSub -> ConstantExpr::get"

          # Fix 4: IndirectBranch.cpp - CriticalEdgeSplittingOptions params
          $f4 = "llvm-project/llvm/lib/Passes/Obfuscation/IndirectBranch.cpp"
          if (-not (Test-Path $f4)) { throw "IndirectBranch.cpp not found" }
          $c4 = Get-Content $f4 -Raw
          $c4 = $c4 -replace 'CriticalEdgeSplittingOptions\(nullptr,\s*nullptr\)', 'CriticalEdgeSplittingOptions()'
          Set-Content -Path $f4 -Value $c4 -Encoding UTF8
          Write-Host "  [OK] IndirectBranch.cpp - CriticalEdgeSplittingOptions default constructor"

          # Verify all patches
          $ok = 0; $total = 4
          if (Select-String -Path $f1 -Pattern 'new FCmpInst\(basicBlock' -Quiet) { $ok++ }
          else { Write-Host "  [FAIL] BogusControlFlow.cpp patch not applied!" }
          if (Select-String -Path $f2 -Pattern 'new AllocaInst\(TYPE_I32, 0, nullptr' -Quiet) { $ok++ }
          else { Write-Host "  [FAIL] Flattening.cpp patch not applied!" }
          if (Select-String -Path $f3 -Pattern 'ConstantExpr::get\(Instruction::Sub, ' -Quiet) { $ok++ }
          else { Write-Host "  [FAIL] IPObfuscationContext.cpp patch not applied!" }
          if (Select-String -Path $f4 -Pattern 'CriticalEdgeSplittingOptions\(\)' -Quiet) { $ok++ }
          else { Write-Host "  [FAIL] IndirectBranch.cpp patch not applied!" }
          Write-Host "Patch summary: $ok/$total fixes applied successfully"

      # ------------------------------------------------------------------
      # Step 8: Copy the standalone plugin project from repository templates
      #
      # The plugin project templates (CMakeLists.txt + OllvmPlugin.cpp) are
      # stored in the repository under ollvm_plugin/.
      #
      # This creates a loadable module (DLL) that can be loaded via:
      #   clang -fpass-plugin=OLLVM-Obfuscator.dll
      # ------------------------------------------------------------------
      - name: Setup standalone plugin project from templates
        shell: pwsh
        run: |
          $pluginDir = "llvm-project/llvm/lib/Passes/OllvmPlugin"
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null

          Copy-Item -Path "ollvm_plugin/CMakeLists.txt" `
            -Destination "$pluginDir/CMakeLists.txt" -Force
          Copy-Item -Path "ollvm_plugin/OllvmPlugin.cpp" `
            -Destination "$pluginDir/OllvmPlugin.cpp" -Force

          Write-Host "Plugin project created successfully at $pluginDir"
          Get-ChildItem -Path $pluginDir -Name

      # ------------------------------------------------------------------
      # Step 9: Add the plugin subdirectory to the parent CMakeLists.txt
      # ------------------------------------------------------------------
      - name: Add plugin subdirectory to LLVM Passes CMakeLists.txt
        shell: pwsh
        run: |
          $cmakeFile = "llvm-project/llvm/lib/Passes/CMakeLists.txt"
          $content = Get-Content $cmakeFile -Raw

          $pluginSubdir = "`n# OLLVM standalone plugin`nadd_subdirectory(OllvmPlugin)`n"

          Set-Content -Path $cmakeFile -Value ($content + $pluginSubdir) -Encoding UTF8
          Write-Host "Added plugin subdirectory to CMakeLists.txt"

      # ------------------------------------------------------------------
      # Step 10: Configure LLVM with CMake
      #
      # Configuration flags:
      #   - Ninja generator for fast parallel builds
      #   - Release build type for optimized libraries
      #   - clang enabled (required for the plugin to work with clang)
      #   - AArch64, ARM, X86 targets (Android/iOS/Windows support)
      #   - LLVM_ENABLE_PLUGINS=ON (required for loadable module support)
      #   - MSVC (cl.exe) as the C/C++ compiler
      # ------------------------------------------------------------------
      - name: Configure LLVM build with CMake
        shell: pwsh
        run: |
          Write-Host "Checking MSVC compiler..."
          $msvcCheck = cl.exe 2>&1 | Out-String
          Write-Host $msvcCheck

          $cmakeArgs = @(
            "-S", "llvm-project/llvm",
            "-B", "build",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DLLVM_ENABLE_PROJECTS=clang",
            "-DLLVM_TARGETS_TO_BUILD=AArch64;ARM;X86",
            "-DLLVM_ENABLE_ASSERTIONS=OFF",
            "-DLLVM_INCLUDE_TESTS=OFF",
            "-DLLVM_INCLUDE_EXAMPLES=OFF",
            "-DLLVM_INCLUDE_DOCS=OFF",
            "-DLLVM_INCLUDE_BENCHMARKS=OFF",
            "-DLLVM_ENABLE_PLUGINS=ON",
            "-DLLVM_BUILD_LLVM_DYLIB=OFF",
            "-DLLVM_ENABLE_EH=OFF",
            "-DLLVM_ENABLE_RTTI=OFF",
            "-DCMAKE_C_COMPILER=cl",
            "-DCMAKE_CXX_COMPILER=cl",
            "-DCMAKE_CXX_STANDARD=17"
          )

          Write-Host "Running cmake configuration..."
          cmake $cmakeArgs 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed. Check the errors above."
          }
          Write-Host "CMake configuration completed successfully"

      # ------------------------------------------------------------------
      # Step 11: Build LLVM libraries
      # ------------------------------------------------------------------
      - name: Build LLVM libraries
        shell: pwsh
        run: |
          Write-Host "Building LLVM libraries..."
          Write-Host "This step may take 1-2 hours depending on the runner."

          Write-Host "Step 1/3: Building intrinsics_gen..."
          ninja -C build intrinsics_gen 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "intrinsics_gen build failed"
          }

          Write-Host "Step 2/3: Building LLVMPasses..."
          ninja -C build LLVMPasses 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "LLVMPasses build failed"
          }

          Write-Host "Step 3/3: Building clang..."
          ninja -C build clang 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "clang build failed"
          }

          Write-Host "LLVM libraries built successfully"

      # ------------------------------------------------------------------
      # Step 12: Build the OLLVM plugin DLL
      # ------------------------------------------------------------------
      - name: Build OLLVM plugin DLL
        shell: pwsh
        run: |
          Write-Host "Building the OLLVM obfuscator plugin DLL..."
          ninja -C build OLLVM-Obfuscator 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "OLLVM plugin build failed"
          }

          Write-Host "Searching for plugin DLL..."
          $pluginFiles = Get-ChildItem -Path "build" -Recurse -Filter "*OLLVM-Obfuscator*" | `
            Where-Object { $_.Extension -in '.dll', '.pdb' } | `
            Select-Object FullName, Length

          if ($pluginFiles.Count -eq 0) {
            Write-Host "WARNING: Plugin DLL not found in recursive search."
            Write-Host "Checking common output directories..."
            $checkPaths = @(
              "build/lib/OLLVMPlugin",
              "build/bin/OLLVMPlugin",
              "build/lib",
              "build/bin"
            )
            foreach ($p in $checkPaths) {
              if (Test-Path $p) {
                Write-Host "Contents of $p :"
                Get-ChildItem -Path $p -Filter "*OLLVM*" | Format-Table Name, Length
              }
            }
            throw "Plugin DLL not found"
          }

          Write-Host "Plugin DLL found:"
          $pluginFiles | Format-Table -AutoSize

          $pluginDll = $pluginFiles | Where-Object { $_.Extension -eq '.dll' } | Select-Object -First 1
          if ($pluginDll) {
            $outputDir = "build/ollvm-plugin-output"
            New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
            Copy-Item -Path $pluginDll.FullName -Destination "$outputDir/OLLVM-Obfuscator.dll" -Force
            Write-Host "Plugin DLL copied to $outputDir/OLLVM-Obfuscator.dll"

            $pluginPdb = $pluginFiles | Where-Object { $_.Extension -eq '.pdb' } | Select-Object -First 1
            if ($pluginPdb) {
              Copy-Item -Path $pluginPdb.FullName -Destination "$outputDir/OLLVM-Obfuscator.pdb" -Force
              Write-Host "Plugin PDB copied to $outputDir/OLLVM-Obfuscator.pdb"
            }
          }

      # ------------------------------------------------------------------
      # Step 13: Upload the plugin DLL as artifact
      # ------------------------------------------------------------------
      - name: Upload OLLVM plugin DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLLVM-Plugin-LLVM19-Windows-x64
          path: |
            build/ollvm-plugin-output/OLLVM-Obfuscator.dll
            build/ollvm-plugin-output/OLLVM-Obfuscator.pdb
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      # ------------------------------------------------------------------
      # Step 14: (Optional) Upload the full LLVM build with OLLVM integrated
      # ------------------------------------------------------------------
      - name: Upload LLVM build with OLLVM (optional)
        uses: actions/upload-artifact@v4
        with:
          name: LLVM-with-OLLVM-Windows-x64
          path: |
            build/bin/clang.exe
            build/bin/clang++.exe
            build/bin/llvm-config.exe
            build/lib/*.lib
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7